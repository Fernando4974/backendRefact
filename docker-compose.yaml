services:
  db:
    image: postgres:14.3
    restart: always
    ports:
      - "6432:5432"
    environment:
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: claud_db
      PGDATA: /var/lib/postgresql/data/pgdata
    container_name: claud_db
    volumes:
      - ./postgres:/var/lib/postgresql/data
